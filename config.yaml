# config.yaml
name: 'Diffusion' # 模型名称
# device: 'cuda' # 使用的设备

model: # 暂时无用，留在这里
  
lr: 1e-4
epochs: 360
eval_interval: 10
beta_start: 0.0001
beta_end: 0.02
timesteps: 200
 
training:
  batch_size: 1 # 批次大小
  strat_epoch: 0  # 开始训练的epoch
  n_epochs: 300 # 总训练迭代次数
  decay_epoch: 20 # 学习率衰减迭代次数

  g_lr: 0.0001 # Generator学习率
  d_lr: 0.0001 # Discriminator学习率
  d_update_interval: 2 # Discriminator更新步长 （每 d_update_interval 代更新1次）
  g_update_interval: 1 # Generator更新步长

  beta1: 0.5 # Adam beta1参数（未采用）
  beta2: 0.999 # Adam beta2参数（未采用）

  lambda_cls: 1.0 # 分类损失权重
  lambda_rec: 10.0 # 重建损失权重
  lambda_gp: 10.0 # 梯度惩罚权重

  num_workers: 4 # 数据加载线程数

  lr: 0.0001                   # initial learning rate 0.0001
  decay_epoch: 20            # epoch to start linearly decaying the learning rate to 0
  size: 256                # size of the data crop
  input_nc: 1         
  output_nc: 1                  
  cuda: True                
  n_cpu: 8

  # lamda weight
  Adv_lamda: 1
  Cyc_lamda: 10
  Corr_lamda: 20
  Smooth_lamda: 10
  Seg_lamda: 1
  flip_lamda: 20


  epoch: 0        # starting epoch
  n_epochs: 300       # How often do you want to display output images during training
  batchSize: 1               # size of the batches


dataset:
  # 训练CT数据路径
  trainCT_root: [
    '/home/featurize/data/train3D/CT_norm_255',
  ]
  # 训练MR数据路径
  trainMR_root: [
    '/home/featurize/data/train3D/MRI_norm',
  ]
  # 测试CT路径
  testCT_root: [
    '/home/featurize/data/test3D/CT_norm_255',
  ]
  # 测试MR路径 
  testMR_root: [
    '/home/featurize/data/test3D/MRI_norm',
  ]
  preload: true  # 将dataset直接加入内存

log_root: '/home/featurize/data/output' # 日志保存路径
log_dir_names: 
  loss: 'metric_loss' # log_root + '/' +  name + '/' + loss_dir_name
  checkpoint: 'checkpoints'
  sample: 'samples'
  result: 'results'


misc:
  mode: train # 运行模式 train 或 test
  log_interval: 10 # 日志记录间隔
  sample_interval: 10 # 采样间隔
  result_interval: 10 # 结果保存间隔
  model_save_interval: 50 # 模型保存间隔

bugfree:
  bugfree_img_path: './utils/bugfree_img/' # bugfree图片路径 (相对路径，相对于工作目录)
  img_name: buddha.bugfree # bugfree图片名称 # buddha.buggfree
  start_color: FF7EC7 # bugfree图片起始颜色
  end_color: FFED46 # bugfree图片结束颜色
